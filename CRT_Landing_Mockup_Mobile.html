<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALGOVIZ CRT Landing Page Mockup — Mobile View</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1e26;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
    font-family: 'Courier New', monospace;
  }

  /* Scanlines overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.05) 2px, rgba(0,0,0,0.05) 4px);
    pointer-events: none;
    z-index: 10;
  }

  /* Vignette overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    box-shadow: inset 0 0 100px rgba(0,0,0,0.45);
    pointer-events: none;
    z-index: 11;
  }

  .content {
    position: relative;
    z-index: 1;
    padding: 48px 20px 80px;
    max-width: 400px;
    margin: 0 auto;
  }

  /* Top bar */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
    padding: 0 2px;
  }
  .brand { font-size: 14px; font-weight: bold; letter-spacing: 0.1em; }
  .version { font-size: 10px; opacity: 0.35; }

  /* Hero title */
  .hero {
    text-align: center;
    margin-bottom: 24px;
  }
  .hero-title {
    font-size: 22px;
    font-weight: bold;
    letter-spacing: -0.01em;
    line-height: 1.3;
  }
  .hero-sub {
    font-size: 11px;
    opacity: 0.4;
    margin-top: 8px;
  }

  /* Menu box */
  .menu-box {
    border: 1.5px solid;
    padding: 12px 14px;
    margin-bottom: 20px;
  }
  .menu-title {
    text-align: center;
    padding-bottom: 8px;
    margin-bottom: 10px;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 0.05em;
  }
  .menu-items {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .menu-row {
    display: flex;
    align-items: center;
    padding: 8px 10px;
    cursor: pointer;
    transition: background 0.15s;
    border-radius: 2px;
  }
  .cursor-col {
    padding: 0 5px;
    font-size: 12px;
    font-weight: bold;
    margin-right: 10px;
    min-width: 23px;
    text-align: center;
  }
  .row-label { font-size: 13px; font-weight: bold; }
  .row-desc { font-size: 10px; opacity: 0.4; margin-left: auto; }
  .menu-divider { border-top: 1px solid; margin: 4px 0; }

  /* Tap hint */
  .tap-hint {
    text-align: center;
    font-size: 10px;
    opacity: 0.3;
    margin-bottom: 20px;
  }

  /* Bottom bar */
  .bottom-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 20px;
    z-index: 5;
    background: linear-gradient(transparent, rgba(26,30,38,0.9) 40%);
  }
  .status {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .status-led {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    transition: background 0.3s, box-shadow 0.3s;
  }
  .status-label { font-size: 9px; opacity: 0.4; }
  .bottom-btns { display: flex; gap: 10px; }
  .pill-btn {
    font-family: 'Courier New', monospace;
    font-size: 9px;
    opacity: 0.5;
    border: 1px solid;
    padding: 3px 10px;
    border-radius: 3px;
    cursor: pointer;
    background: transparent;
    transition: opacity 0.2s, background 0.2s;
  }
  .pill-btn:hover { opacity: 0.8; }
  .pill-btn:active { opacity: 1; }

  @keyframes blink { 50% { opacity: 0; } }
  .blink { animation: blink 1s step-end infinite; }
</style>
</head>
<body>

<div class="content">

  <!-- Top bar -->
  <div class="top-bar">
    <span class="brand ph">ALGOVIZ</span>
    <span class="version ph">v1.0.0</span>
  </div>

  <!-- Hero -->
  <div class="hero">
    <div class="hero-title ph">Algorithm<br>Visualizer<span class="blink" style="display:inline;">_</span></div>
    <div class="hero-sub ph">> Learn through interactive visualizations</div>
  </div>

  <!-- Menu box -->
  <div class="menu-box" id="menu-box">
    <div class="menu-title ph" id="menu-header">MAIN MENU</div>

    <div class="menu-items">
      <div class="menu-row" id="active-row">
        <span class="cursor-col" id="cursor-arrow">></span>
        <span class="row-label ph">Arrays</span>
        <span class="row-desc ph">6 algos</span>
      </div>
      <div class="menu-row">
        <span class="cursor-col">&nbsp;</span>
        <span class="row-label ph">Linked Lists</span>
        <span class="row-desc ph">4 ops</span>
      </div>
      <div class="menu-row">
        <span class="cursor-col">&nbsp;</span>
        <span class="row-label ph">Trees</span>
        <span class="row-desc ph">7 ops</span>
      </div>
      <div class="menu-row">
        <span class="cursor-col">&nbsp;</span>
        <span class="row-label ph">Hash Tables</span>
        <span class="row-desc ph">3 ops</span>
      </div>
      <div class="menu-row">
        <span class="cursor-col">&nbsp;</span>
        <span class="row-label ph">Graphs</span>
        <span class="row-desc ph">4 algos</span>
      </div>

      <div class="menu-divider ph-border"></div>

      <div class="menu-row">
        <span class="cursor-col">&nbsp;</span>
        <span class="row-label ph">Blind 75</span>
        <span class="row-desc ph">75 problems</span>
      </div>
    </div>
  </div>

  <div class="tap-hint ph">Tap to select</div>

</div>

<!-- Bottom bar -->
<div class="bottom-bar">
  <div class="status">
    <div class="status-led" id="power-led"></div>
    <span class="status-label ph">ONLINE</span>
  </div>
  <div class="bottom-btns">
    <button class="pill-btn ph" id="color-btn">COLOR</button>
    <button class="pill-btn ph">ABOUT</button>
  </div>
</div>

<script>
  const THEMES = {
    green: {
      main: '#3fb950',
      bg: 'rgba(63,185,80,0.12)',
      cursorBg: '#3fb950',
      cursorText: '#0d1117',
      border: 'rgba(63,185,80,0.25)',
      borderFaint: 'rgba(63,185,80,0.15)',
      btnBorder: 'rgba(63,185,80,0.3)',
      led: '#4ade80',
      ledGlow: '0 0 4px #4ade80'
    },
    amber: {
      main: '#FFBF40',
      bg: 'rgba(255,191,64,0.12)',
      cursorBg: '#FFBF40',
      cursorText: '#0d1117',
      border: 'rgba(255,191,64,0.25)',
      borderFaint: 'rgba(255,191,64,0.15)',
      btnBorder: 'rgba(255,191,64,0.3)',
      led: '#FFBF40',
      ledGlow: '0 0 4px #FFBF40'
    }
  };

  let currentTheme = 'green';

  function applyTheme(t) {
    // All phosphor text
    document.querySelectorAll('.ph').forEach(el => el.style.color = t.main);

    // Blinking cursor
    document.querySelector('.blink').style.color = t.main;

    // Menu box border
    document.getElementById('menu-box').style.borderColor = t.main;

    // Menu header underline
    document.getElementById('menu-header').style.borderBottomColor = t.border;

    // Active row
    document.getElementById('active-row').style.background = t.bg;

    // Cursor arrow
    const arrow = document.getElementById('cursor-arrow');
    arrow.style.color = t.cursorText;
    arrow.style.background = t.cursorBg;

    // Dividers
    document.querySelectorAll('.ph-border').forEach(el => el.style.borderTopColor = t.borderFaint);

    // Pill buttons
    document.querySelectorAll('.pill-btn').forEach(el => el.style.borderColor = t.btnBorder);

    // Power LED
    const led = document.getElementById('power-led');
    led.style.background = t.led;
    led.style.boxShadow = t.ledGlow;
  }

  // Initialize
  applyTheme(THEMES.green);

  // COLOR toggle
  document.getElementById('color-btn').addEventListener('click', function() {
    currentTheme = currentTheme === 'green' ? 'amber' : 'green';
    applyTheme(THEMES[currentTheme]);
  });
</script>

</body>
</html>
